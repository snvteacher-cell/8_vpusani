<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2747a8">
<title>Вписані та описані чотирикутники: тренажер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --fg:#1b2333; --muted:#5b6578; --line:#d3d9e4; --grid:#e3eaf5;
  --ink:#2747a8; --ink-soft:#e6ecfa;
  --f1:#d4520f; --f1-soft:#fde9dc; --f2:#0a7d6c; --f2-soft:#d9f2ee;
  --ok:#1f8a4c; --ok-soft:#dff1e6; --bad:#c2312d; --bad-soft:#f9e0de; --gold:#c98a00; --gold-soft:#fbf0d3;
  --display:"Rubik","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151d; --surface:#1a202b; --fg:#e7ebf3; --muted:#a2acbd; --line:#2e3646; --grid:#242c3a;
  --ink:#8fa8ff; --ink-soft:#212b45;
  --f1:#ff9a5c; --f1-soft:#3c2618; --f2:#4fd1bc; --f2-soft:#163632;
  --ok:#5ccb8b; --ok-soft:#183626; --bad:#ff7d72; --bad-soft:#3e1f1d; --gold:#ffc94d; --gold-soft:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#1a202b; --fg:#e7ebf3; --muted:#a2acbd; --line:#2e3646; --grid:#242c3a;
  --ink:#8fa8ff; --ink-soft:#212b45;
  --f1:#ff9a5c; --f1-soft:#3c2618; --f2:#4fd1bc; --f2-soft:#163632;
  --ok:#5ccb8b; --ok-soft:#183626; --bad:#ff7d72; --bad-soft:#3e1f1d; --gold:#ffc94d; --gold-soft:#3a2f12; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.5;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:22px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(1.45rem,4vw,2.3rem);line-height:1.15;margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:56ch}
header p.teacher{margin-top:4px;font-weight:800;color:var(--ink)}
.rank{background:var(--surface);border:2px solid var(--gold);border-radius:14px;padding:8px 12px;min-width:220px;display:grid;gap:3px}
.rank .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rank b{font-family:var(--display);font-weight:500;font-size:1rem;color:var(--gold)}
.rank span{font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.rank .meter{height:8px;border-radius:99px;background:var(--gold-soft);overflow:hidden}
.rank .meter i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .5s}
.rank small{color:var(--muted);font-size:.8rem}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 16px}
.tab{font:inherit;font-weight:800;font-size:1rem;padding:9px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab b{font-family:var(--display);font-weight:500;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:.9rem}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab[aria-selected="true"] b{border-color:var(--surface)}
button:focus-visible,input:focus-visible{outline:3px solid var(--f1);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px)}
h2{font-family:var(--display);font-weight:500;font-size:1.35rem;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 16px;max-width:66ch}

.btn{font:inherit;font-weight:800;font-size:1rem;padding:10px 16px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.main{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.hint{border-color:var(--gold);background:var(--gold-soft)}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pills button{font:inherit;font-weight:800;font-size:.95rem;padding:7px 14px;min-height:40px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.pills button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink-soft);color:var(--ink)}

/* drawings on squared paper */
.fig{border:1px solid var(--line);border-radius:14px;padding:6px;
  background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px}
.fig svg{display:block;width:100%;height:auto;max-height:250px}
.fig .sf{fill:var(--ink-soft);opacity:.85}
.fig .so{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
.fig .shade{fill:var(--f2-soft);opacity:.95}
.fig line,.fig path,.fig polyline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.fig .diag{stroke:var(--muted);stroke-width:1.8}
.fig .hl{stroke-width:5}
.fig .c1{stroke:var(--f1)} .fig .c2{stroke:var(--f2)} .fig .cm{stroke:var(--muted)}
.fig text{font-family:var(--body);font-weight:800;font-size:15px;fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.fig text.vl{font-size:17px;fill:var(--ink)}
.fig text.c1{fill:var(--f1);stroke:var(--surface)} .fig text.c2,.fig text.q{fill:var(--f2);stroke:var(--surface)}
.fig text.q{font-size:17px}
.fig .dot{fill:var(--ink)}
.cap{margin-top:8px;text-align:center;font-weight:800;color:var(--ink);font-size:1.05rem}

/* theory */
.theory{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
.tree{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:center}
.tree .wide{grid-column:1/-1;justify-self:center}
.tree .conn{grid-column:1/-1;height:22px}
.tree .conn svg{width:100%;height:22px;display:block}
.tree .conn line{stroke:var(--line);stroke-width:2.5}
.fam{font:inherit;font-weight:800;font-size:.95rem;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);padding:6px 12px 6px 6px;cursor:pointer;display:flex;align-items:center;gap:8px;justify-self:center;min-height:48px}
.fam svg{width:38px;height:30px;flex:none}
.fam svg polygon{fill:var(--ink-soft);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.fam[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.fam[aria-pressed="true"] svg polygon{fill:var(--surface);stroke:var(--surface)}
.def{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--ink-soft);border-left:5px solid var(--ink)}
.props{display:grid;gap:8px;margin-top:12px}
.props button{font:inherit;font-size:1rem;font-weight:700;text-align:left;padding:10px 12px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;gap:10px;align-items:center}
.props button::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.props button[aria-pressed="true"]{border-color:var(--f1);background:var(--f1-soft)}
.props button[aria-pressed="true"]::before{background:var(--f1);border-color:var(--f1)}
.note{margin-top:12px;color:var(--muted);font-size:.95rem}
h4.sec{font-family:var(--display);font-weight:700;font-size:1rem;margin:18px 0 0;padding:4px 12px;border-radius:8px;display:inline-block;background:var(--ink);color:var(--surface);letter-spacing:.02em}
.thfig{position:sticky;top:0;z-index:2;background:var(--surface);padding:6px 0 4px}
.fbfig{margin-top:10px;max-width:300px}
.fbfig svg{max-height:170px}
.lvlprog{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;color:var(--muted);margin:0 0 12px}
.lvlprog i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.lvlprog i.on{background:var(--ok);border-color:var(--ok)}
.namebox{display:grid;gap:8px;margin:0 0 14px;max-width:420px}
.namebox label{font-weight:800;display:grid;gap:4px}
.namebox input{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}

/* warm-up */
.qcard{max-width:620px;margin:0 auto}
.progress{display:flex;justify-content:space-between;gap:10px;font-weight:800;color:var(--muted);font-size:.95rem;margin-bottom:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.dots i{width:22px;height:8px;border-radius:99px;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--ink)}
.qtext{font-size:1.15rem;font-weight:700;margin:10px 0 4px}
.qkind{font-family:var(--display);font-weight:500;color:var(--f1);font-size:.95rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opts button{font:inherit;font-weight:800;font-size:1.05rem;padding:12px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.opts button.right{background:var(--ok-soft);border-color:var(--ok)}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opts button:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:1rem}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)} .fb.info{background:var(--gold-soft)}
.fb .ttl{font-weight:800;display:block}
.final{text-align:center;padding:10px 0}
.final .big{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1.1;color:var(--ink)}
.final p{margin:6px 0}

/* tasks */
.task{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.thead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.lvl{font-weight:800;font-size:.85rem;padding:3px 10px;border-radius:99px;background:var(--gold-soft);color:var(--fg);border:1px solid var(--gold)}
.streak{font-weight:800;font-size:.9rem;color:var(--f1)}
.ttext{font-size:1.1rem;margin:4px 0 12px}
.ins{display:flex;flex-wrap:wrap;gap:10px}
.in{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.1rem}
.in input{font:inherit;font-weight:800;width:4.6em;text-align:center;padding:7px 6px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.in input.ok{border-color:var(--ok);background:var(--ok-soft)}
.in input.no{border-color:var(--bad);background:var(--bad-soft)}
.in .u{color:var(--muted);font-weight:700}
.hints{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.hints li{padding:8px 12px;border-radius:10px;background:var(--gold-soft);border-left:4px solid var(--gold);font-size:1rem}
.hints li b{color:var(--gold)}
.sol{font-weight:800}
/* proof ordering */
.ord h4{margin:10px 0 6px;font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ord ol,.ord ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ord button{font:inherit;font-size:.98rem;text-align:left;width:100%;padding:9px 12px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;gap:8px}
.ord .placed button{border-color:var(--ink);background:var(--ink-soft)}
.ord .placed button i{font-style:normal;font-weight:800;color:var(--ink);flex:none}
.ord .placed button.no{border-color:var(--bad);background:var(--bad-soft)}
.ord .placed button.ok{border-color:var(--ok);background:var(--ok-soft)}
.ord .empty{color:var(--muted);font-size:.95rem;padding:8px 12px;border:2px dashed var(--line);border-radius:10px}

/* exam */
.exbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.exdots{display:flex;flex-wrap:wrap;gap:6px}
.exdots button{font:inherit;font-weight:800;font-size:.85rem;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:0}
.exdots button.ans{background:var(--ink-soft);border-color:var(--ink)}
.exdots button.cur{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.rules{margin:0 0 14px;padding-left:1.2em}
.rules li{margin:4px 0}
.review{display:grid;gap:8px;margin-top:14px;text-align:left}
.review div{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.98rem}
.review div.ok{border-color:var(--ok)} .review div.part{border-color:var(--gold)} .review div.no{border-color:var(--bad)}
.review b{display:block}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-200px);visibility:hidden;transition:transform .35s;z-index:30;background:var(--gold);color:#1b1400;font-weight:800;padding:10px 18px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}

@media (max-width:820px){
  .theory,.task{grid-template-columns:minmax(0,1fr)}
}
/* ---------- phone ---------- */
@media (max-width:720px){
  body{font-size:17px}
  .wrap{padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
  header{align-items:stretch}
  header h1{font-size:1.4rem}
  header p{font-size:.9rem}
  .rank{width:100%;min-width:0}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.07)}
  .tab{border:0;border-radius:12px;padding:5px 2px;font-size:.74rem;font-weight:700;flex-direction:column;gap:2px;background:transparent;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab b{width:30px;height:30px;font-size:1rem}
  .tab[aria-selected="true"]{background:var(--ink-soft);color:var(--ink)}
  .tab[aria-selected="true"] b{background:var(--ink);border-color:var(--ink);color:var(--surface)}
  .panel{margin-top:12px;padding:16px 12px;border-radius:16px}
  h2{font-size:1.2rem}
  .lead{font-size:.95rem}
  .pills{flex-wrap:nowrap;overflow-x:auto;margin-inline:-12px;padding:0 12px 4px}
  .pills button{flex:none}
  .fam{font-size:.85rem;padding:4px 8px 4px 4px}
  .fam svg{width:32px;height:26px}
  .opts{grid-template-columns:1fr}
  .opts.two{grid-template-columns:1fr 1fr}
  .row-btns .btn{flex:1 1 auto}
  .ttext{font-size:1.05rem}
  .toast{top:10px}
}
/* coordinate plane */
.fig:has(svg.pl){background-image:none}
.fig .gr{stroke:var(--grid);stroke-width:1}
.fig .ax{stroke:var(--fg);stroke-width:1.6}
.fig .axh{fill:none;stroke:var(--fg);stroke-width:1.6}
.fig .dash{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 4}
.fig .dash.c1{stroke:var(--f1)} .fig .dash.c2{stroke:var(--f2)}
.fig .seg{stroke:var(--ink);stroke-width:2.6}
.fig .seg.c1{stroke:var(--f1)} .fig .seg.c2{stroke:var(--f2)}
.fig .lnn{stroke:var(--ink);stroke-width:2.4}
.fig .lnn.c1{stroke:var(--f1)} .fig .lnn.c2{stroke:var(--f2)}
.fig circle.cc{fill:none;stroke:var(--ink);stroke-width:2.4}
.fig circle.cc.c1{stroke:var(--f1)} .fig circle.cc.c2{stroke:var(--f2)}
.fig .arc0{fill:none;stroke:var(--ink);stroke-width:2.4}
.fig .pd{fill:var(--ink)} .fig .pd.c1{fill:var(--f1)} .fig .pd.c2,.fig .pd.q{fill:var(--f2)}
.fig text.tk{font-size:11px;font-weight:600;fill:var(--muted);stroke-width:3px}
.fig text.axn{font-size:15px;font-style:italic;fill:var(--fg)}
.fig text.big{font-size:20px;fill:var(--muted)}
.fig text.sm{font-size:13px}
.fig .shade{fill:var(--f2-soft);opacity:.95}
.fig .shade1{fill:var(--f1-soft);opacity:.95}
/* topics */
.topics{display:grid;gap:8px}
.topics .fam{justify-self:stretch;text-align:left}
.fam svg path,.fam svg line,.fam svg circle{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.fam svg .d{fill:var(--ink);stroke:none}
.fam[aria-pressed="true"] svg path,.fam[aria-pressed="true"] svg line,.fam[aria-pressed="true"] svg circle{stroke:var(--surface)}
.fam[aria-pressed="true"] svg .d{fill:var(--surface)}
.fam .num{font-family:var(--display);font-weight:500;color:var(--muted);font-size:.85rem;margin-left:auto}
.fam[aria-pressed="true"] .num{color:var(--surface)}
table.tv{border-collapse:collapse;margin-top:10px;font-size:.95rem;font-variant-numeric:tabular-nums;min-width:100%}
.tvw{overflow-x:auto;margin-top:6px;max-width:100%}
table.tv th,table.tv td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
table.tv th{background:var(--ink-soft);color:var(--ink);font-family:var(--display);font-weight:500}
table.tv td.neg{color:var(--f1);font-weight:800}
.in .pm{font:inherit;font-weight:800;min-width:38px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0 6px}
.eq{font-weight:800;font-size:1.1rem;margin:0 0 10px;padding:8px 12px;border-radius:10px;background:var(--ink-soft);display:inline-block}
.opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink-soft)}
.opts.four{grid-template-columns:1fr 1fr}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:2px 3px;line-height:1.25}
.fr>span{padding:0 3px;white-space:nowrap}.prop{white-space:nowrap;display:inline-block}
.h2n{font-family:var(--body);font-weight:600;font-size:.95rem;color:var(--muted)}
#p-th h2{margin-bottom:14px}
.panel .lead,.rules{font-size:.82rem;line-height:1.4;margin-bottom:10px}
@media (max-width:820px){.theory{gap:12px}#thName{margin:4px 0 6px}}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:330px;margin-top:12px}
.kp button{font:inherit;font-weight:800;font-size:1.25rem;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;touch-action:manipulation}
.kp button:active{background:var(--ink-soft);border-color:var(--ink)}
.kp .w{grid-column:span 2;font-size:1rem}
.kp .del{color:var(--bad)}
.eqrow{align-items:center;gap:4px;font-weight:800;font-size:1.15rem}.eqrow .in input{width:2.9em;padding:7px 2px}
.in input.act{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}.fr>span+span{border-top:2px solid currentColor}
.author{margin:18px 0 0;font-size:.75rem;color:var(--muted);opacity:.6;text-align:left}
.fig .so{stroke-width:2.6}
/* ---------- середня лінія: доповнення ---------- */
@media (max-width:720px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dots i.help{background:var(--gold)}
.steps{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.steps li{padding:8px 12px;border-radius:10px;background:var(--gold-soft);border-left:4px solid var(--gold);font-size:1rem}
.steps li b{color:var(--gold)}
h3 .lvl{font-family:var(--body);font-size:.8rem;vertical-align:middle;margin-left:6px}
.opts.pics{grid-template-columns:1fr 1fr;max-width:640px}
.opts.pics button{padding:6px;display:grid;gap:4px;text-align:left}
.opts.pics .pl{font-family:var(--display);font-weight:500;padding-left:6px}

<script>
const BOARD=/*BOARD*/false;
/* Куди надсилати результати тестування (сервіс FormSubmit.co). Порожньо = автоматичне надсилання вимкнене.
   Після першого надісланого результату на цю адресу прийде лист з кнопкою «Activate Form»: її треба натиснути один раз. */
const TEACHER_EMAIL=BOARD?'':'snv.teacher@gmail.com';
const TITLE='Вписані та описані чотирикутники';
const KEY='cyc8-';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rndNo=(a,b,no)=>{let x;do x=rnd(a,b);while(no.includes(x));return x};
function plural(n,f1,f2,f5){const m=Math.abs(n)%100,k=m%10;if(m>10&&m<20)return f5;if(k===1)return f1;if(k>=2&&k<=4)return f2;return f5}
const baly=n=>n+' '+plural(n,'бал','бали','балів');
const fn=n=>(n<0?'−':'')+String(Math.abs(Math.round(n*1000)/1000)).replace('.',',');
/* дроби завжди з горизонтальною рискою: «a : b» у тексті стає дробом */
const FR=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const P1='\\((?:[^()]|\\([^()]*\\))*\\)',TOK='[^\\s()<>;,]+';
const unp=x=>x[0]==='('&&x[x.length-1]===')'?x.slice(1,-1):x;
function FX(s){if(typeof s!=='string')return s;
  s=s.replace(new RegExp(`(${P1}|${TOK}) : (${P1}|${TOK})`,'g'),(m,a,b)=>{let e='';const t=b.match(/[.]+$/);if(t&&b[0]!=='('){e=t[0];b=b.slice(0,-e.length)}return FR(unp(a),unp(b))+e});
  return s}
const strip=s=>String(s).replace(/<[^>]+>/g,'');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- малювання ---------- */
const V=(x,y)=>({x,y});
const f1=n=>Math.round(n*10)/10;
const R=Math.PI/180;
const lerp=(p,q,t)=>V(p.x+(q.x-p.x)*t,p.y+(q.y-p.y)*t),mid=(p,q)=>lerp(p,q,.5);
function unit(a,b){const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return V(dx/l,dy/l)}
function add(p,u,k){return V(p.x+u.x*k,p.y+u.y*k)}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ln=(a,b,c)=>`<line class="${c||''}" x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}"/>`;
const tx=(p,t,c)=>`<text class="${c||''}" x="${f1(p.x)}" y="${f1(p.y)}" text-anchor="middle" dominant-baseline="central">${t}</text>`;
const dot=(p,c,r)=>`<circle class="${c||'dot'}" cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r||3.5}"/>`;
const circ=(O,r,c)=>`<circle class="cc ${c||''}" cx="${f1(O.x)}" cy="${f1(O.y)}" r="${f1(r)}"/>`;
function tick(p,q,n,c){const u=unit(p,q),pr=V(-u.y,u.x),m=mid(p,q);let s='';
  for(let i=0;i<n;i++){const t=add(m,u,(i-(n-1)/2)*6);s+=ln(add(t,pr,7),add(t,pr,-7),c||'')}return s}
function arcPath(v,p1,p2,r){const u1=unit(v,p1),u2=unit(v,p2),a=add(v,u1,r),b=add(v,u2,r),cr=u1.x*u2.y-u1.y*u2.x;
  return{d:`M${f1(a.x)} ${f1(a.y)} A${r} ${r} 0 0 ${cr>0?1:0} ${f1(b.x)} ${f1(b.y)}`,b:unit(V(0,0),V(u1.x+u2.x,u1.y+u2.y))}}
/* точка перетину прямих p1+s·u1 і p2+t·u2 */
function meet(p1,u1,p2,u2){const d=u1.x*u2.y-u1.y*u2.x;if(Math.abs(d)<1e-12)return null;const s=((p2.x-p1.x)*u2.y-(p2.y-p1.y)*u2.x)/d;return add(p1,u1,s)}
function cc3(a,b,c){const m1=mid(a,b),m2=mid(b,c),u1=unit(a,b),u2=unit(b,c);return meet(m1,V(-u1.y,u1.x),m2,V(-u2.y,u2.x))}
function bis(v,p,q){const a=unit(v,p),b=unit(v,q);return unit(V(0,0),V(a.x+b.x,a.y+b.y))}
function incenter(Q){return meet(Q[0],bis(Q[0],Q[3],Q[1]),Q[1],bis(Q[1],Q[0],Q[2]))}
function lineDist(p,a,b){const u=unit(a,b);return Math.abs((p.x-a.x)*u.y-(p.y-a.y)*u.x)}
/* o: poly, circ{O,r,c}, segs[[a,b,cls]], ticks[[a,b,n]], angs[{v,t,c}], dots[k], tps[k], lab[k], n{k:name}, off{k:[dx,dy]}, sides[{a,b,t,c,o,at,dd}], cen, pre, post, nol */
function pic(P,o){const W=o.W||340,H=o.H||230,N=o.n||{},nm=k=>N[k]??k,poly=(o.poly||[]).map(k=>P[k]);
  const cen=o.cen?P[o.cen]:poly.length?V(poly.reduce((s,p)=>s+p.x,0)/poly.length,poly.reduce((s,p)=>s+p.y,0)/poly.length):V(W/2,H/2);
  const pts=poly.map(p=>f1(p.x)+','+f1(p.y)).join(' ');
  let s=o.pre||'';
  if(poly.length)s+=`<polygon class="sf" points="${pts}"/>`;
  if(o.circ)s+=circ(o.circ.O,o.circ.r,o.circ.c);
  if(poly.length)s+=`<polygon class="so" points="${pts}"/>`;
  (o.segs||[]).forEach(([a,b,c])=>s+=ln(P[a],P[b],c||''));
  (o.ticks||[]).forEach(([a,b,n])=>s+=tick(P[a],P[b],n,'cm'));
  const lab=[];
  (o.angs||[]).forEach(g=>{const n=o.poly.length,i=o.poly.indexOf(g.v),v=P[g.v],a=arcPath(v,P[o.poly[(i+n-1)%n]],P[o.poly[(i+1)%n]],g.r||18);
    s+=`<path class="arc ${g.c||'c1'}" d="${a.d}"/>`+(g.c2?`<path class="arc ${g.c||'c1'}" d="${arcPath(v,P[o.poly[(i+n-1)%n]],P[o.poly[(i+1)%n]],(g.r||18)+5).d}"/>`:'');
    if(g.t!==undefined)lab.push(tx(add(v,a.b,(g.r||18)+(g.dd||17)),g.t,g.c==='c2'?'q':'c1'))});
  s+=o.post||'';
  (o.dots||[]).forEach(k=>s+=dot(P[k]));
  (o.tps||[]).forEach(k=>s+=dot(P[k],'tp',4));
  if(!o.nol)[...(o.poly||[]),...(o.dots||[]),...(o.lab||[])].filter((k,i,a)=>a.indexOf(k)===i).forEach(k=>{const off=(o.off||{})[k],t=nm(k);if(!t)return;
    lab.push(tx(off?V(P[k].x+off[0],P[k].y+off[1]):add(P[k],unit(cen,P[k]),15),t,'vl'))});
  (o.sides||[]).forEach(sd=>{const p=P[sd.a],q=P[sd.b],m=lerp(p,q,sd.at??.5);let pos;
    if(sd.o)pos=V(m.x+sd.o[0],m.y+sd.o[1]);else{const u=unit(p,q);let nr=V(-u.y,u.x);if((m.x-cen.x)*nr.x+(m.y-cen.y)*nr.y<0)nr=V(-nr.x,-nr.y);pos=add(m,nr,sd.dd||14)}
    lab.push(tx(pos,sd.t,sd.c||'c1'))});
  return `<svg class="${o.sk?'pl':''}" viewBox="0 0 ${W} ${H}">${s}${lab.join('')}</svg>`}

/* фігури біля кола: вершини задаються кутами (у градусах) на колі або точками дотику */
const pol=(a,d)=>V(d*Math.cos(a*R),-d*Math.sin(a*R));
function fitAll(P,W,H,m){const ks=Object.keys(P).filter(k=>P[k]&&P[k].x!==undefined);const xs=[],ys=[];ks.forEach(k=>{xs.push(P[k].x);ys.push(P[k].y)});
  if(P.r){xs.push(P.O.x-P.r,P.O.x+P.r);ys.push(P.O.y-P.r,P.O.y+P.r)}
  const a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys),k=Math.min((W-2*m)/(b-a),(H-2*m)/(d-c));
  const sx=(W-(b-a)*k)/2-a*k,sy=(H-(d-c)*k)/2-c*k,Q={};ks.forEach(x=>Q[x]=V(P[x].x*k+sx,P[x].y*k+sy));if(P.r)Q.r=P.r*k;return Q}
function cycP(an,mod,o={}){const P={O:V(0,0),r:100};['A','B','C','D'].forEach((k,i)=>P[k]=pol(an[i],100));if(mod)mod(P);return fitAll(P,o.W||340,o.H||230,o.m??26)}

function tanP(t,mod,o={}){const P={O:V(0,0),r:100},vx=(p,q)=>pol((p+q)/2,100/Math.cos((p-q)/2*R));
  P.B=vx(t[0],t[1]);P.C=vx(t[1],t[2]);P.D=vx(t[2],t[3]);P.A=vx(t[3],t[0]-360);
  P.T1=pol(t[0],100);P.T2=pol(t[1],100);P.T3=pol(t[2],100);P.T4=pol(t[3],100);
  if(mod)mod(P);return fitAll(P,o.W||340,o.H||230,o.m??26)}

function cycAng(A,B){let best=null;for(let b=40;b<=160;b+=2){const g=2*A-b,d=2*B-g,a=360-b-g-d,mn=Math.min(a,b,g,d);if(!best||mn>best[0])best=[mn,a,b,g,d]}

const PTV={rec:1,con:1,ang:1,side:1,app:2};

const ORDER=[['rec',0],['rec',1],['con',0],['con',1],['ang',0],['ang',1],['side',0],['side',1],['app',0],['app',1]];
const TRV={};
function make(type,lv,avoid){const arr=GEN[type][lv];let v=rnd(0,arr.length-1);if(arr.length>1&&v===avoid)v=(v+rnd(1,arr.length-1))%arr.length;

  t.text=FX(t.text);t.sol=FX(t.sol);t.steps=t.steps.map(FX);if(t.opts&&!t.pics)t.opts=t.opts.map(FX);

/* ---------- відповіді: клавіатура, вибір, точки ---------- */
const num=s=>{s=String(s).replace(/[°\s]|см/g,'').replace(/[−–—]/g,'-').replace(',','.');return s===''||s==='-'?NaN:Number(s)};
function insHTML(t,pref,kp){const inp=(x,i)=>`<input id="${pref}${i}" inputmode="none" autocomplete="off" enterkeyhint="done" aria-label="${strip(x.l)}">`;
  return `<div class="ins">${t.inputs.map((x,i)=>`<label class="in"><span>${x.l} =</span>${inp(x,i)}${x.u?`<span class="u">${x.u}</span>`:''}</label>`).join('')}</div>`+
  (kp===false?'':`<div class="kp" aria-label="клавіатура">${['7','8','9','⌫','4','5','6','−','1','2','3',',','0','→'].map(k=>`<button type="button" data-k="${k}" class="${k==='0'||k==='→'?'w':k==='⌫'?'del':''}" aria-label="${k==='⌫'?'стерти':k==='→'?'наступне поле':k==='−'?'мінус':k}">${k==='→'?'Наступне →':k}</button>`).join('')}</div>`)}
function bindKP(box,after){const ins=[...box.querySelectorAll('.in input')];if(!ins.length)return;
  let act=null;const setAct=el=>{act=el;ins.forEach(i=>i.classList.toggle('act',i===el))};

    if(k==='→'){setAct(ins[(ins.indexOf(act)+1)%ins.length]);return}
    if(k==='⌫')v=v.slice(0,-1);else if(k==='−')v=v.startsWith('-')?v.slice(1):'-'+v;
    else if(k===','){if(!/[,.]/.test(v))v=(v===''||v==='-'?v+'0':v)+','}else{if(v.replace('-','').length>=6)return;v=v.replace(/^(-?)0$/,'$1')+k}
    act.value=v;act.classList.remove('ok','no');if(after)after()}})}
function choiceHTML(t,locked,reveal){return `<div class="opts two${t.pics?' pics':''}">${t.opts.map((o,i)=>{const cl=(reveal&&i===t.ans)?'right':(i===t.wrongSel||(reveal&&i===t.sel&&i!==t.ans))?'wrong':'';
  return `<button data-c="${i}" aria-pressed="${t.sel===i}" class="${cl}" ${locked?'disabled':''}>${t.pics?`<span class="pl">${LAB[i]}</span><div class="fig">${o}</div>`:`${LAB[i]}. ${o}`}</button>`}).join('')}</div>`}
function pkSVG(t,reveal){const k=t.pk;let post=reveal&&k.rev?k.rev():'';
  k.pts.forEach(c=>{const on=t.selPts.includes(c.id),ok=reveal&&k.target.includes(c.id);
    post+=`<g class="cg" data-p="${c.id}"><circle class="hit" cx="${f1(c.p.x)}" cy="${f1(c.p.y)}" r="15"/><circle class="cand${on?' on':''}${ok?' okp':''}" cx="${f1(c.p.x)}" cy="${f1(c.p.y)}" r="${on||ok?7.5:5.5}"/></g>`});
  return k.draw(post)}
function conMsg(t){const k=t.pk;if(t.selPts.length<k.need)return `Обери ще ${k.need-t.selPts.length}.`;

  if(k.need>1)return `Правильних точок: ${k.need-bad.length} з ${k.need}. Червоні — там, де коло не дотикається до сторони.`;
  return k.why[bad[0]]||k.why._||'З цією точкою умова не виконується.'}
function judge(t){if(t.inputs){const m=t.inputs.map((x,i)=>Math.abs(num(t.vals[i])-x.a)<1e-6);return{ok:m.every(Boolean),marks:m,got:m.filter(Boolean).length}}
  if(t.pk){const ok=t.selPts.length===t.pk.need&&t.pk.target.every(x=>t.selPts.includes(x));return{ok}}

const ready=t=>t.inputs?t.vals.some(v=>v.trim()!==''):t.pk?t.selPts.length===t.pk.need:t.sel!==null;

function bindTask(box,t,pref,locked,redraw,onEnter){

  const steps=t.hintN?`<ol class="steps">${t.steps.slice(0,t.hintN).map((s,i)=>`<li><b>Крок ${i+1}.</b> ${s}</li>`).join('')}</ol>`:'';
  box.innerHTML=`<div class="modes">${LF.tasks.map((x,i)=>`<button data-j="${i}" aria-pressed="${i===LF.i}">${i+1}. ${x.title}${x.solved&&!x.shown?' ✓':''}</button>`).join('')}</div>`+
    taskHTML(t,'l',t.solved,`${steps}<div>${t.fb}</div><div class="row-btns" id="lfBtns"></div>`);
  box.querySelectorAll('.modes [data-j]').forEach(b=>b.onclick=()=>{LF.i=+b.dataset.j;lfDraw();window.scrollTo(0,0)});
  bindTask(box,t,'l',t.solved,lfDraw,lfCheck);
  const B=$('lfBtns'),last=LF.i===LF.tasks.length-1;
  B.innerHTML=(t.solved?'':`<button class="btn main" id="lfCheck">Перевірити</button>`+(t.hintN<t.steps.length?`<button class="btn hint" id="lfHint">Крок ${t.hintN+1} з ${t.steps.length}</button>`:'')+(BOARD||t.wrong>=2||t.hintN>=t.steps.length?`<button class="btn" id="lfShow">${BOARD?'Показати розв\'язання':'Показати відповідь'}</button>`:''))+
    `<button class="btn" id="lfNew">Нові числа</button><button class="btn" id="lfPrev" ${LF.i===0?'disabled':''}>← Назад</button><button class="btn" id="lfNext" ${last?'disabled':''}>Вперед →</button>`;
  if($('lfCheck')){$('lfCheck').onclick=lfCheck;t.onChange=()=>{$('lfCheck').disabled=!ready(t)};$('lfCheck').disabled=!ready(t)}
  if($('lfHint'))$('lfHint').onclick=()=>{t.hintN++;lfDraw()};
  if($('lfShow'))$('lfShow').onclick=()=>{t.solved=t.shown=true;t.hintN=t.steps.length;answerShow(t);t.fb=`<div class="fb info"><span class="ttl">Відповідь: ${t.sol}</span></div>`;lfDraw()};
  $('lfNew').onclick=()=>{LF.tasks[LF.i]=lfMake(LF.i);lfDraw()};
  $('lfPrev').onclick=()=>{if(LF.i>0){LF.i--;lfDraw();window.scrollTo(0,0)}};$('lfNext').onclick=()=>{if(!last){LF.i++;lfDraw();window.scrollTo(0,0)}}}
function lfCheck(){const t=LF.tasks[LF.i];if(t.solved||!ready(t))return;const r=judge(t);if(t.inputs)t.marks=r.marks;
  if(r.ok){t.solved=true;award(t.hintN||t.shown?1:2);t.hintN=t.steps.length;t.fb=`<div class="fb ok"><span class="ttl">${pick(['Чудово!','Правильно!','Так тримати!'])}</span>Ось розв'язання.</div>`}
  else{t.wrong++;let msg=t.inputs?(t.vals.some(v=>v.trim()==='')?'Заповни всі поля.':'Перевір червоні поля.'):'Ця відповідь неправильна.';if(t.hintN<t.steps.length){t.hintN++;msg+=` Подивись крок ${t.hintN}.`}
    if(t.opts){t.wrongSel=t.sel;t.sel=null}t.fb=`<div class="fb no"><span class="ttl">Ще не зовсім.</span>${msg}</div>`}
  lfDraw()}
lfDraw();

award=function(){};
try{const s=localStorage.getItem(KEY+'tab');if(s&&$(s))openTab($(s))}catch(e){}
</script>
</body>
</html>
